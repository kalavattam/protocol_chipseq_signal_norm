schema_version = 2

[runner]
timeout_seconds = 120
max_output_bytes = 65536

[artifacts]
bytecode_globs = ["**/*.pyc", "**/__pycache__/**"]
other_generated_globs = ["artifacts/tests/**", ".pytest_cache/**", ".DS_Store", "**/.DS_Store"]

[audit_infrastructure]
paths = ["dev/README.md", "dev/audit/**", "dev/config/**", "dev/schemas/**", "artifacts/dev/audit/.gitignore"]
exclude = []

[prompting]
max_paths = 8
max_findings = 20
max_excerpt_chars = 12000
max_rule_chars = 4000

[[rule]]
rule_id = "SHELL.SYNTAX"
description = "Parse selected dirty Bash sources with env_protocol Bash and the POSIX bootstrap with sh."
normative_document = "docs/standards/shell.md"
normative_section = "Shell syntax and runtime (`SHELL.SYNTAX`)"
owner_classification = "advisory"
source_checker = "tests/contract/repository/test_shell_syntax.sh"
execution_kind = "adapter"
execution_role = "checker"
coverage_relation = "subset"
covered_scope = "Parse selected dirty Bash sources with env_protocol Bash and the POSIX bootstrap with sh."
remaining_scope = "Review external shell-version behavior and constructs not exercised on all supported hosts."
parity_test = "upstream Bash parser fixtures"
scope = "per_path"
batch_paths = true
adapter = "shell_syntax_batch"
command = ["conda", "run", "--no-capture-output", "-n", "env_protocol", "bash", "-n", "{path}"]
applicable_paths = ["bin/**/*.sh", "lib/bash/**/*.sh", "install/scripts/**/*.sh", "tests/**/*.sh"]
default_severity = "error"
blocking = false
semantic_review = false
required_environment = "env_protocol"
required_commands = ["conda", "sh"]
known_side_effects = ["none"]
output_paths = []
output_parser = "bash_stderr"
strict_availability = "safe_adapter"
current_exclusions_or_allowlists = []

