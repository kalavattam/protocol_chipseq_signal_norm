name: env_siqchip
channels:
  - conda-forge
  - bioconda
# This environment runs the original siQ-ChIP implementation, whose output this
# repository compares against, so the same reproducibility argument applies to
# the tools that move its numbers. Kinds of pins and a note about pinning more
# packages are found in 'env_protocol.yml'.
#
# These two versions come from dry-run solves rather than from an installation:
# 'bc' on 2026-08-13 and 'samtools' on 2026-10-27. This environment has not yet
# been built.
dependencies:
  - bc=1.07.1      # Note: Pinned for reproducibility; carries the reference implementation's arithmetic.
  - bedtools
  - datamash       # Maybe: remove; nothing in 'lib/', 'src/', 'bin/', or 'tests/' invokes it.
  - gfortran
  - gnuplot
  - parallel
  - samtools=1.25  # Note: Pinned for reproducibility; matches the 'env_protocol' pin so both sides count alignments identically.
  - tree
  - ucsc-bedclip
  - ucsc-bedgraphtobigwig
