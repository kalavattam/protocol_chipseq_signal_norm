name: env_analyze
channels:
  - conda-forge
  - bioconda
# Pin kinds and the argument against pinning more are stated in
# 'env_protocol.yml'. Only 'deeptools' is pinned here: it is the one declared
# package whose output this repository compares its own numbers against.
dependencies:
  - bioconductor-annotationdbi
  - bioconductor-chipqc
  - bioconductor-chipseeker
  - bioconductor-clusterprofiler
  - bioconductor-deseq2
  - bioconductor-diffbind
  - bioconductor-edger
  - bioconductor-enhancedvolcano
  - bioconductor-genomicfeatures
  - bioconductor-genomicranges
  - bioconductor-ihw
  - bioconductor-iranges
  - bioconductor-pcatools
  - bioconductor-sva
  - datamash         # Maybe: remove; nothing in 'lib/', 'src/', 'bin/', or 'tests/' invokes it.
  - deeptools=3.5.6  # Note: Pinned for reproducibility.
  - gawk
  - gnuplot
  - ipython
  - pandas
  - parallel
  - pbzip2
  - phantompeakqualtools
  - pigz
  - r-argparse
  - r-dendextend
  - r-devtools
  - r-ggalt
  - r-ggpubr
  - r-ggrepel
  - r-ggsci
  - r-pheatmap
  - r-plotly
  - r-readxl
  - r-rjson
  - r-tidyverse
  - r-upsetr
  - r-venneuler
  - r-writexl
  - r-xml2
  - rename
  - tree

