#  Configuration for 'parse_metadata_siqchip.py'
#+
#+ This file is required via '--cfg' and defines filename parsing, column
#+ aliases, and metadata matching behavior
#+
#+ Filename parsing modes are attempted in the following order:
#+
#+   1. Regex mode
#+      - If 'filename.pattern' is non-null, the script uses that regex
#+        directly
#+      - In regex mode, the user defines which named groups are present and
#+        which fields are therefore parsed from the filename
#+      - Missing optional fields may be filled from
#+        'filename.pattern_group_defaults', if applicable
#+
#+   2. Layout mode
#+      - Otherwise, the script uses layout-based parsing
#+      - If 'filename.layouts' is provided and non-empty, the listed layouts
#+        are tried in order until one parses successfully
#+      - Layout mode is intended for token-based filename parsing without
#+        requiring users to write full regular expressions

filename:
    #  Delimiter used by layout-based filename parsing
    delimiter: "_"

    #  File extensions stripped before parsing
    strip_extensions:
        - ".bam"
        - ".cram"
        - ".sam"

    #  Optional regex applied after stripping the main extension; useful for
    #+ removing a trailing tag like '.sc' or '.sp'
    strip_trailing_tag_regex: '\.[^.]+$'

    #  Allowed assay tokens at the start of the filename
    assay_tokens:
        - "IP"
        - "in"
        # - "FLAGIP"
        # - "Input"

    #  Tokens recognized as 'state' in layout-based filename parsing
    states:
        - "G1"
        - "G2M"
        - "log"
        - "Q"

    #  Power-user override: if non-null, the script uses this regex instead of
    #+ layout-based parsing; use Python regex syntax and named capture groups
    #+
    #+ Example:
    #+     pattern: '^(?P<assay>IP|in)_(?:(?P<genotype>[^_]+)_)?(?:(?P<state>[^_]+)_)?(?:(?P<treatment>[^_]+)_)?(?P<factor>[^_]+)_(?P<strain>[^_]+)$'
    #+
    #+ Another example:
    #+     pattern: '^(?P<strain>[^_]+)_(?P<factor>[^_]+)_(?P<state>[^_]+)_(?P<treatment>[^_]+)_(?P<assay>[^_]+)$'
    pattern: null

    #  Defaults used only in regex mode when optional groups are missing or
    #+ empty
    pattern_group_defaults:
        genotype: "NA"
        state: "NA"
        treatment: "NA"

    #  Optional user-defined layouts for layout-based parsing
    #+
    #+ A layout defines how underscore-delimited tokens should be assigned;
    #+ this is useful when filenames follow a token-based convention but do
    #+ not fit a single simple regex pattern
    #+
    #+ Supported field names:
    #+     assay, genotype, state, treatment, factor, strain
    #+
    #+ Conventions:
    #+     - Exactly one field should have 'position: first'
    #+     - Exactly one field should have 'position: last'
    #+     - Use 'required: true' for fields that must be detected
    #+     - Use 'required: false' for optional fields
    #+     - Fields without fixed positions are resolved from the interior
    #+       tokens in the listed field order
    #+     - Optional fields may be skipped when the next token does not match
    #+     - Parsing succeeds only if all tokens are assigned consistently
    #+
    #+ Example:
    #+     layouts:
    #+         - name: alt_flagip
    #+           fields:
    #+              - {name: strain, required: true, position: first}
    #+              - {name: factor, required: true}
    #+              - {name: state, required: false}
    #+              - {name: treatment, required: false}
    #+              - {name: assay, required: true, position: last}
    layouts:
        - name: canonical
          fields:
              - {name: assay,     required: true,  position: first}
              - {name: genotype,  required: false}
              - {name: state,     required: false}
              - {name: treatment, required: false}
              - {name: factor,    required: true}
              - {name: strain,    required: true,  position: last}

        # - name: alt_flagip
        #   fields:
        #       - {name: strain,    required: true,  position: first}
        #       - {name: factor,    required: true}
        #       - {name: state,     required: false}
        #       - {name: treatment, required: false}
        #       - {name: assay,     required: true,  position: last}

    genotype:
        #  Tokens treated as exact genotype matches
        exact:
            - "WT"

        #  Suffixes treated as genotype markers
        suffixes:
            - "-KO"

        #  Suffixes explicitly excluded from genotype matching
        exclude_suffixes:
            - "-flag"

    factor:
        #  Regexes used in layout-based parsing to recognize factor tokens
        regex:
            - '^H[1-4](?:[A-Za-z0-9]+)?$'  # Standard histone H1-4 mods
            - '^[A-Za-z0-9]+-flag$'        # Protein followed by "-flag"

        #  Explicit factor whitelist used in layout-based parsing (based on
        #+ Tsukiyama Lab samples)
        whitelist:
            - "Chd1"
            - "Brn1"
            - "Hho1"
            - "Hmo1"
            - "Ino80"
            - "Isw1"
            - "Isw2"
            - "Pol1"
            - "Pol2"
            - "Pol3"
            - "PolI"
            - "PolII"
            - "PolIII"
            - "R16"
            - "R16F"
            - "R7"
            - "R7F"
            - "Rad16"
            - "Rad7"
            - "Rpb1"
            - "Rpb2"
            - "Rsc8"
            - "Snf2"
            - "Sth1"
            - "Swr1"

matching:
    #  If true, allow parsed factor to match either the canonical "factor"
    #+ column or "factor_abbrev"
    factor_uses_abbrev: true

    #  If true, require treatment to match as well when treatment is available;
    #+ if false, treatment is parsed but ignored during row matching
    match_treatment: false

    #  Values treated as wildcards for genotype/state/treatment matching
    wildcard_values:
        - ""
        - "NA"
        - "N/A"

table:
    #  Prefixes identifying comment/header lines to skip before CSV/TSV parsing
    skip_prefixes:
        - "#"
        - "//"

