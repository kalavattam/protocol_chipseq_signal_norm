#  Deterministic siQ-ChIP metadata parser configuration for PRJNA857063
#+
#+ This reference expects factor-tagged logical input names such as
#+ 'in_HeLa_DMSO_H3K18ac_rep1.hs.bam' so shared input runs can be paired with
#+ factor-specific IP measurements
#+
#+ For filename-to-metadata-table matching, users should customize
#+ - 'filename.fields'
#+ - 'matching.fields'
#+ - 'field_to_column'
#+
#+ In 'calculator_inputs', the left-side names are fixed workflow export keys,
#+ so users should customize only the right-side metadata TSV column names

version: 2
profile: "prjna857063-deterministic"

filename:
    delimiter: "_"
    strip_extensions:
        - ".bam"
        - ".cram"
        - ".sam"
    strip_suffixes:
        - ".hs"
        - ".dm"
    fields:
        - assay
        - cell
        - treatment
        - factor
        - id

matching:
    fields:
        - cell
        - treatment
        - factor

field_to_column:
    id: replicate  # Parsed but not matched for this no-replicate study

table:
    skip_prefixes:
        - "#"
        - "//"

calculator_inputs:
    siqchip:
        #  Left-side names are fixed parser-to-wrapper export keys; right-side
        #+ names are user metadata TSV column names
        required:
            vol_in: volume_in
            vol_all: volume_all
            mass_in: mass_in
            mass_ip: mass_ip
        optional:
            conc_in: conc_in
            conc_ip: conc_ip
            len_in: length_in
            len_ip: length_ip
            dep_in: dep_in
            dep_ip: dep_ip
            lib_vol_in: lib_vol_in
            lib_vol_ip: lib_vol_ip
